<svg viewBox="0 0 768 298" width="768" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">How a manifest becomes a finding</title>
  <desc id="pipeline-desc">Manifests are parsed, a rule engine evaluates them, and the findings are written out as SARIF for code scanning and as text or JSON for a terminal.</desc>

  <style>
    text { font-family: 'Switzer', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', system-ui, sans-serif; }
  </style>

  <defs>
    <marker id="arrow-blue" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#3b82f6"/>
    </marker>
    <marker id="arrow-orange" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="2" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L8,4 L0,8 L2,4 z" fill="#22c55e"/>
    </marker>
  </defs>

  <!-- fundo claro, para o SVG nao ficar transparente sobre o papel do site -->
  <rect x="0" y="0" width="768" height="298" fill="#ffffff"/>

  <!-- titulo centrado no centro do conteudo (22 + 746) / 2 = 384 -->
  <text x="384" y="32" text-anchor="middle" font-size="16" fill="#1e293b">How a manifest becomes a finding</text>

  <!-- ================= conectores (pintados antes das caixas) ================= -->

  <!-- Manifests 22..182 -> Parser 210..370 : inicio 182+5=187, fim 210-11=199 -->
  <path d="M187,92 L 199,92" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Parser 210..370 -> Rule engine 398..558 : inicio 370+5=375, fim 398-11=387 -->
  <path d="M375,92 L 387,92" fill="none" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Rule engine 398..558 -> Findings 586..746 : inicio 558+5=563, fim 586-11=575 -->
  <path d="M563,92 L 575,92" fill="none" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrow-orange)"/>

  <!-- Findings 586..746 y=64..120 -> grupo Output 368..746 y=148 : descida reta, 120+5=125, 148-11=137 -->
  <path d="M666,125 L 666,137" fill="none" stroke="#22c55e" stroke-width="1.5" marker-end="url(#arrow-green)"/>

  <!-- ================= linha 1, y=64, h=56 ================= -->

  <!-- Manifests: x=22, w=160 -->
  <rect x="22" y="64" width="160" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="102" y="87" text-anchor="middle" font-size="12" fill="#1e40af">Manifests</text>
  <text x="102" y="105" text-anchor="middle" font-size="10" fill="#1e40af">YAML from a repository</text>

  <!-- Parser: x=210, w=160 -->
  <rect x="210" y="64" width="160" height="56" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="290" y="87" text-anchor="middle" font-size="12" fill="#1e40af">Parser</text>
  <text x="290" y="105" text-anchor="middle" font-size="10" fill="#1e40af">one object per manifest</text>

  <!-- Rule engine: x=398, w=160 -->
  <rect x="398" y="64" width="160" height="56" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="478" y="87" text-anchor="middle" font-size="12" fill="#b45309">Rule engine</text>
  <text x="478" y="105" text-anchor="middle" font-size="10" fill="#b45309">one function per check</text>

  <!-- Findings: x=586, w=160 -->
  <rect x="586" y="64" width="160" height="56" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="666" y="87" text-anchor="middle" font-size="12" fill="#166534">Findings</text>
  <text x="666" y="105" text-anchor="middle" font-size="10" fill="#166534">rule, severity, message</text>

  <!-- ================= grupo de saida, y=148 ================= -->

  <!-- grupo tracejado: x=368, y=148, w=378, h=96 -->
  <rect x="368" y="148" width="378" height="96" rx="10" stroke="#94a3b8" stroke-dasharray="6,4" fill="none"/>
  <text x="378" y="162" font-size="11" fill="#64748b">Output</text>

  <!-- SARIF output: x=383, y=172, w=160, h=56 -->
  <rect x="383" y="172" width="160" height="56" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="463" y="195" text-anchor="middle" font-size="12" fill="#166534">SARIF output</text>
  <text x="463" y="213" text-anchor="middle" font-size="10" fill="#166534">for code scanning</text>

  <!-- Text and JSON: x=571, y=172, w=160, h=56 -->
  <rect x="571" y="172" width="160" height="56" rx="8" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="651" y="195" text-anchor="middle" font-size="12" fill="#166534">Text and JSON</text>
  <text x="651" y="213" text-anchor="middle" font-size="10" fill="#166534">for a terminal</text>

  <!-- ================= legenda, fora do corpo ================= -->

  <circle cx="28" cy="268" r="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="44" y="272" font-size="10" fill="#64748b">Input</text>

  <circle cx="94" cy="268" r="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="110" y="272" font-size="10" fill="#64748b">Check</text>

  <circle cx="166" cy="268" r="6" fill="#d1fae5" stroke="#22c55e" stroke-width="1.5"/>
  <text x="182" y="272" font-size="10" fill="#64748b">Output</text>
</svg>
